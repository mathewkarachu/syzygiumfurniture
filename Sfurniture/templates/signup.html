<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login signup">
        <section>
           <form action="">
    <h2>Syzygium Furniture</h2>
    <h3>Create your account</h3>
    <h5>Curate spaces that feel distinctly yours.</h5>

    <div class="input-group">
        <input
            type="text"
            id="username"
            required
            placeholder=" "
        >
        <label for="username">Username</label>
    </div>
     <div class="input-group">
        <input
            type="email"
            id="email"
            required
            placeholder=" "
        >
        <label for="email">Email</label>
    </div>

    <div class="input-group">
        <input
            type="password"
            id="password"
            required
            placeholder=" "
        >
        <label for="password">Password</label>
    </div>
    <div class="input-group">
        <input
            type="password"
            id="password"
            required
            placeholder=" "
        >
        <label for="password">Confirm Password</label>
    </div>
    
   

   

    <input type="submit" value="Create account" class="button">

    <a href="login.html">Already have an account? Sign in</a>
</form>
        </section>
    </main>

    
</body>
</html>
